# Render Blueprint — deploys the Jarvis backend + its Postgres in one click.
# In Render: New + → Blueprint → point it at this repo.
services:
  - type: web
    name: jarvis
    runtime: python
    plan: standard           # 2GB RAM — upgraded July 2026 after two 512MB
                             # memory restarts in a day; always-on for the heartbeat
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: PUBLIC_URL
        sync: false          # set to the service URL after first deploy
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: TRELLO_KEY
        sync: false
      - key: TRELLO_TOKEN
        sync: false
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: KIEFER_EMAIL
        sync: false
      - key: CALENDAR_ICS_URL
        sync: false
      - key: EMAIL1_ADDRESS
        sync: false
      - key: EMAIL1_APP_PASSWORD
        sync: false
      - key: EMAIL2_ADDRESS
        sync: false
      - key: EMAIL2_APP_PASSWORD
        sync: false
      - key: EMAIL3_ADDRESS
        sync: false
      - key: EMAIL3_APP_PASSWORD
        sync: false
      - key: APPLE_HEALTH_WEBHOOK_SECRET
        generateValue: true
      - key: PRIVATE_ROOM_KEY
        generateValue: true   # encryption key for the private room — generated once, kept by Render

  # Read-only WhatsApp bridge (Master Update §13) — companion device on the
  # DEDICATED number. QR to link appears in this service's logs. The disk
  # keeps the WhatsApp session across restarts (no re-scanning).
  - type: worker
    name: jarvis-whatsapp
    runtime: node
    rootDir: bridge/whatsapp
    plan: starter
    buildCommand: npm install
    startCommand: node index.js
    disk:
      name: wa-auth
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JARVIS_WEBHOOK_URL
        sync: false   # https://<jarvis url>/webhook/whatsapp/<secret> — Jarvis tells Paul the exact value

databases:
  - name: jarvis-db
    plan: basic-256mb
    postgresMajorVersion: "16"
