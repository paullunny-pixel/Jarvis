<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Jarvis</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <div id="status-dot" class="dot idle"></div>
    <div id="status-text">Starting…</div>
    <div class="header-actions">
      <button id="dashboard-btn" title="Open the dashboard">🖥</button>
      <button id="pin-btn" title="Keep on top">📌</button>
      <button id="mute-btn" title="Mute the wake word">🎙</button>
      <button id="settings-btn" title="Settings">⚙️</button>
    </div>
  </header>

  <main id="feed"></main>

  <footer>
    <button id="talk-btn" class="talk">Start conversation</button>
    <form id="type-form">
      <input id="type-input" type="text" placeholder="Or type to Jarvis…" autocomplete="off" />
    </form>
  </footer>

  <div id="settings-panel" class="hidden">
    <h2>Settings</h2>
    <label>Backend URL
      <input id="cfg-url" type="text" placeholder="https://jarvis-xxxx.onrender.com" />
    </label>
    <label>Desktop secret <span class="hint">(ask Jarvis on Telegram: “desktop setup”)</span>
      <input id="cfg-secret" type="password" placeholder="paste the desktop secret" />
    </label>
    <p class="hint">The “Hey Jarvis” wake word runs fully on this Mac (openWakeWord) — no key needed.</p>
    <label class="row" style="flex-direction: row; align-items: center; gap: 8px;">
      <input id="cfg-dash-boot" type="checkbox" style="width: auto;" />
      <span>Open the dashboard in my browser when the app starts</span>
    </label>
    <div class="row">
      <button id="cfg-save">Save &amp; connect</button>
      <button id="cfg-close" type="button">Close</button>
    </div>
    <p id="cfg-status" class="hint"></p>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
